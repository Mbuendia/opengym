services:
  # 1. API Service (Node.js backend)
  - type: web
    name: opengym-api
    env: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /data
      - key: RP_ID
        fromService:
          type: web
          name: opengym-web
          property: host
      - key: ORIGIN
        value: https://opengym-web.onrender.com
      - key: RP_NAME
        value: openGym

  # 2. Web Service (Nginx + React Frontend)
  - type: web
    name: opengym-web
    env: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NGINX_PORT
        value: 80
      - key: PORT
        value: 80
      - key: BACKEND
        fromService:
          type: web
          name: opengym-api
          property: host
      - key: API_PORT
        fromService:
          type: web
          name: opengym-api
          property: port
